<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>لا يوجد اتصال · Flowpal</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #ffffff;
        color: #0f1b33;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #5b6477; line-height: 1.7; font-size: 15px; }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 12px;
        background: #0f1b33;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Flowpal" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تأكد من اتصالك ثم أعد المحاولة. الطلبات والمحادثات تظهر فقط مع الاتصال حتى تبقى محدّثة دائماً.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
